# =============================================================================
# Analytics backend (FastAPI) — Kubernetes deployment
# -----------------------------------------------------------------------------
# Застосовує Jenkins-джоба «Analytics Backend Deploy» через envsubst:
#     envsubst < deploy.yaml | kubectl apply -f -
# envsubst підставляє КОЖНУ змінну з доларом у цьому файлі, коментарі теж: використовувати
# лише SERVICE_NAME, NAMESPACE, REPOSITORY, IMAGE_TAG, HOST.
#   SERVICE_NAME = analytics-backend (ім'я зашите у фронті: BACKEND_UPSTREAM у його deploy.yaml)
#   HOST         = analytics.kub.k2.lan — публічний хост фронту; тут лише для Keycloak/CORS,
#                  власного Ingress бекенд не має: браузер ходить на https://${HOST}/api/*,
#                  і nginx фронту проксіює це сюди.
#
# Що в поді:
#   * ${SERVICE_NAME}        — uvicorn, порт 8000, /health (нічого зовнішнього не перевіряє — збій
#                              ClickHouse/Redis не повинен перезапускати под).
#   * ${SERVICE_NAME}-redis  — спільний кеш аналітики (окремий Deployment нижче). Падіння Redis API
#                              переживає (лише без кешу).
#   * PVC ${SERVICE_NAME}-data (/app/data) — три SQLite-бази застосунку: користувачі, конфігурація,
#     BI (дашборди). Це єдині дані, які не відновлюються — бекапити.
#
# Одна репліка і WEB_CONCURRENCY=1 свідомо: SQLite на RWO-томі. Масштабувати — лише після переїзду
# цих баз на Postgres/Keycloak.
#
# ConfigMap ${SERVICE_NAME}-config і Secret ${SERVICE_NAME}-secret створено в кластері ПОРОЖНІМИ,
# у yaml їх немає (заповнити руками, потім `kubectl -n ${NAMESPACE} rollout restart deploy/${SERVICE_NAME}`):
#   ConfigMap: DATA_SOURCE (clickhouse | mock; без нього — mock), CLICKHOUSE_URL
#              (http://host:8123 або https://host:8443), CLICKHOUSE_DATABASE, CLICKHOUSE_USER,
#              CLICKHOUSE_VERIFY_SSL, KEYCLOAK_ENABLED ("true"), KEYCLOAK_ISSUER
#              (https://auth.infrastructure.kub.k2.lan/realms/k2), KEYCLOAK_CLIENT_ID, KEYCLOAK_ADMIN_ROLE
#   Secret:    CLICKHOUSE_PASSWORD, KEYCLOAK_CLIENT_SECRET,
#              DATABASE_URL (postgresql://user:password@host:port/db — користувачі, доступи, дашборди
#              і налаштування в PostgreSQL; без нього — SQLite-файли з PVC, як раніше),
#              APP_ADMIN_TOKEN (лише без Keycloak — створення першого адміна),
#              CACHE_ADMIN_TOKEN (необов'язково — вмикає POST /api/cache/clear)
#   kubectl -n ${NAMESPACE} patch secret ${SERVICE_NAME}-secret -p '{"stringData":{"CLICKHOUSE_PASSWORD":"…"}}'
#   kubectl -n ${NAMESPACE} patch configmap ${SERVICE_NAME}-config -p '{"data":{"CLICKHOUSE_URL":"…"}}'
#
# Keycloak: клієнт KEYCLOAK_CLIENT_ID — confidential, redirect URI https://${HOST}/api/auth/keycloak/callback,
# post-logout https://${HOST}/.
#
# Ключі нижче в env: перебивають ConfigMap/Secret — це структура деплою (шляхи, Redis, префікс, хост).
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${SERVICE_NAME}-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: ""   # задати, якщо в кластері немає default StorageClass
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${SERVICE_NAME}-redis
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE_NAME}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  # RollingUpdate без простою: новий под поруч (maxSurge 1), старий живе, доки новий не Ready.
  # Том даних RWO — podAffinity нижче ставить новий под на вузол старого, де том монтується обома.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAffinity:
          # Для першого пода правило до власного лейбла вважається виконаним. При drain вузла
          # деплой поводиться як Recreate.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: ${SERVICE_NAME}
      securityContext:
        # appuser (uid 10001) з образу; fsGroup — щоб том даних був йому на запис.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${SERVICE_NAME}
          image: "${REPOSITORY}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ${SERVICE_NAME}-config
            - secretRef:
                name: ${SERVICE_NAME}-secret
          env:
            - name: APP_VERSION
              value: "${IMAGE_TAG}"
            - name: API_PREFIX
              value: "/api"
            - name: LOG_LEVEL
              value: "info"
            # uvicorn-процеси. 1, поки бази застосунку — SQLite.
            - name: WEB_CONCURRENCY
              value: "1"
            # JSON-конфіги — з образу (config/ репозиторію).
            - name: CONFIG_ROOT_DIR
              value: "/app/config"
            - name: BACKEND_CONFIG_DIR
              value: "/app/config/backend"
            - name: APP_USERS_DB
              value: "/app/data/app_users.sqlite3"
            - name: APP_CONFIGURATION_DB
              value: "/app/data/app_configuration.sqlite3"
            - name: APP_BI_DB
              value: "/app/data/app_bi.sqlite3"
            - name: APP_BI_VIEWER_DEFAULT_SCOPE
              value: "NONE"
            # Сайт лише по https (Ingress фронту з TLS).
            - name: APP_SESSION_COOKIE_SECURE
              value: "true"
            - name: API_CORS_ORIGINS
              value: "https://${HOST}"
            - name: KEYCLOAK_REDIRECT_URI
              value: "https://${HOST}/api/auth/keycloak/callback"
            - name: KEYCLOAK_FRONTEND_URL
              value: "https://${HOST}"
            - name: REDIS_URL
              value: "redis://${SERVICE_NAME}-redis:6379/0"
            - name: CACHE_ENABLED
              value: "true"
            - name: CACHE_KEY_PREFIX
              value: "analytics"
            - name: CACHE_MAX_VALUE_BYTES
              value: "4194304"
            # Схема PostgreSQL (коли в Secret є DATABASE_URL) і розмір пулу з'єднань.
            - name: DATABASE_SCHEMA
              value: "app"
            - name: DATABASE_POOL_SIZE
              value: "8"
            # Пам'ять: не більше двох важких розрахунків одночасно; при 70% ліміту (2 ГБ нижче)
            # фоновий прогрів кешу стає на паузу, а пам'ять повертається системі.
            - name: MEMORY_LIMIT_MB
              value: "2048"
            - name: HEAVY_COMPUTE_CONCURRENCY
              value: "2"
            - name: MEMORY_PRESSURE_PERCENT
              value: "70"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Пауза, щоб nginx фронту/haproxy побачили под вибулим до SIGTERM.
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${SERVICE_NAME}-data
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE_NAME}
spec:
  type: ClusterIP
  selector:
    app: ${SERVICE_NAME}
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
---
# Redis — кеш аналітики (AOF на томі: ключі поколінь/ревізій без TTL переживають рестарт).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}-redis
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE_NAME}-redis
spec:
  replicas: 1
  revisionHistoryLimit: 1
  # Один процес на AOF-файл — без перекриття подів.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${SERVICE_NAME}-redis
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}-redis
    spec:
      securityContext:
        # користувач redis (uid/gid 999) з образу
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: 10.20.50.25:8081/redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - "900 1 300 10 60 10000"
            - --maxmemory
            - 512mb
            # Ключі поколінь/ревізій без TTL; витісняються лише значення з TTL.
            - --maxmemory-policy
            - volatile-lfu
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "768Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${SERVICE_NAME}-redis
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}-redis
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE_NAME}-redis
spec:
  type: ClusterIP
  selector:
    app: ${SERVICE_NAME}-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
